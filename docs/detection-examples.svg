<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Privacy Guard Rails detection and redaction examples</title>
  <desc id="desc">A synthetic screenshot with an API key, identity number, and IBAN is detected locally and converted to a redacted safe image.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#172033" flood-opacity=".12"/>
    </filter>
    <pattern id="mosaic" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#26364d"/>
      <rect width="9" height="9" fill="#6c7d94"/>
      <rect x="9" y="9" width="9" height="9" fill="#41546d"/>
    </pattern>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1000" height="560" rx="24" fill="#f4f7fb"/>
  <text x="40" y="47" class="sans" font-size="22" font-weight="750" fill="#172033">命中示例 · Local detection examples</text>
  <text x="40" y="73" class="sans" font-size="13" fill="#6b7485">以下内容均为合成数据，OCR、检测与遮挡全部在浏览器本地完成</text>

  <g filter="url(#shadow)">
    <rect x="40" y="100" width="410" height="270" rx="16" fill="#fff" stroke="#e4e9f1"/>
    <rect x="550" y="100" width="410" height="270" rx="16" fill="#fff" stroke="#dce8e1"/>
  </g>

  <circle cx="66" cy="127" r="6" fill="#c7372f"/>
  <text x="82" y="132" class="sans" font-size="13" font-weight="700" fill="#172033">上传前原图 · Original</text>
  <rect x="348" y="115" width="82" height="24" rx="12" fill="#fff0ee"/>
  <text x="389" y="131" class="sans" font-size="10" font-weight="750" text-anchor="middle" fill="#c7372f">3 处风险</text>

  <text x="66" y="175" class="sans" font-size="12" font-weight="650" fill="#6b7485">API_KEY</text>
  <text x="145" y="175" class="mono" font-size="13" fill="#172033">sk-proj-••••••••••••••••</text>
  <rect x="138" y="154" width="260" height="29" rx="5" fill="none" stroke="#ef4444" stroke-width="2"/>

  <text x="66" y="235" class="sans" font-size="12" font-weight="650" fill="#6b7485">身份证</text>
  <text x="145" y="235" class="mono" font-size="13" fill="#172033">110105********002X</text>
  <rect x="138" y="214" width="219" height="29" rx="5" fill="none" stroke="#ef4444" stroke-width="2"/>

  <text x="66" y="295" class="sans" font-size="12" font-weight="650" fill="#6b7485">IBAN</text>
  <text x="145" y="295" class="mono" font-size="13" fill="#172033">GB82 WEST 1234 5698 7654 32</text>
  <rect x="138" y="274" width="277" height="29" rx="5" fill="none" stroke="#ef4444" stroke-width="2"/>

  <rect x="65" y="326" width="360" height="27" rx="7" fill="#fff7e8"/>
  <text x="78" y="344" class="sans" font-size="11" fill="#8b5b13">建议：自动脱敏并预览，再上传安全版本</text>

  <path d="M474 226h46" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <path d="m512 217 10 9-10 9" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="497" cy="226" r="26" fill="#eaf1ff" opacity=".65"/>

  <circle cx="576" cy="127" r="6" fill="#15803d"/>
  <text x="592" y="132" class="sans" font-size="13" font-weight="700" fill="#172033">脱敏后图片 · Safe version</text>
  <rect x="858" y="115" width="82" height="24" rx="12" fill="#eaf8ef"/>
  <text x="899" y="131" class="sans" font-size="10" font-weight="750" text-anchor="middle" fill="#15803d">可确认上传</text>

  <text x="576" y="175" class="sans" font-size="12" font-weight="650" fill="#6b7485">API_KEY</text>
  <rect x="648" y="154" width="260" height="29" rx="5" fill="url(#mosaic)"/>

  <text x="576" y="235" class="sans" font-size="12" font-weight="650" fill="#6b7485">身份证</text>
  <rect x="648" y="214" width="219" height="29" rx="5" fill="url(#mosaic)"/>

  <text x="576" y="295" class="sans" font-size="12" font-weight="650" fill="#6b7485">IBAN</text>
  <rect x="648" y="274" width="277" height="29" rx="5" fill="url(#mosaic)"/>

  <rect x="575" y="326" width="360" height="27" rx="7" fill="#eaf8ef"/>
  <text x="588" y="344" class="sans" font-size="11" fill="#15803d">✓ 用户可继续拖动添加遮挡，然后确认上传</text>

  <g filter="url(#shadow)">
    <rect x="40" y="402" width="286" height="112" rx="14" fill="#fff"/>
    <rect x="357" y="402" width="286" height="112" rx="14" fill="#fff"/>
    <rect x="674" y="402" width="286" height="112" rx="14" fill="#fff"/>
  </g>
  <rect x="58" y="420" width="34" height="34" rx="10" fill="#fff0ee"/>
  <text x="75" y="443" class="sans" font-size="17" font-weight="800" text-anchor="middle" fill="#c7372f">01</text>
  <text x="104" y="435" class="sans" font-size="13" font-weight="750" fill="#172033">凭据与密钥</text>
  <text x="104" y="456" class="sans" font-size="11" fill="#6b7485">API Key · OAuth · Cookie</text>
  <text x="58" y="489" class="sans" font-size="11" fill="#6b7485">支持 PEM / SSH 私钥整块遮挡</text>

  <rect x="375" y="420" width="34" height="34" rx="10" fill="#eaf1ff"/>
  <text x="392" y="443" class="sans" font-size="17" font-weight="800" text-anchor="middle" fill="#2563eb">02</text>
  <text x="421" y="435" class="sans" font-size="13" font-weight="750" fill="#172033">身份与联系方式</text>
  <text x="421" y="456" class="sans" font-size="11" fill="#6b7485">身份证 · 护照 · SSN · 邮箱</text>
  <text x="375" y="489" class="sans" font-size="11" fill="#6b7485">带校验位和字段上下文，降低误报</text>

  <rect x="692" y="420" width="34" height="34" rx="10" fill="#eaf8ef"/>
  <text x="709" y="443" class="sans" font-size="17" font-weight="800" text-anchor="middle" fill="#15803d">03</text>
  <text x="738" y="435" class="sans" font-size="13" font-weight="750" fill="#172033">金融与企业信息</text>
  <text x="738" y="456" class="sans" font-size="11" fill="#6b7485">银行卡 · IBAN · 税号 · 关键词</text>
  <text x="692" y="489" class="sans" font-size="11" fill="#6b7485">支持 Luhn、MOD-97 与自定义敏感词</text>
</svg>
