<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Guard Rails</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #172033;
        --muted: #6b7485;
        --line: #e4e9f1;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-soft: #eaf1ff;
        --success: #15803d;
        --success-soft: #eaf8ef;
        --danger: #b42318;
        --danger-soft: #fff0ee;
        --control: #f8fafc;
        --shadow: 0 10px 30px rgba(31, 45, 70, .09);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111827;
          --card: #1b2433;
          --text: #f3f6fb;
          --muted: #a7b0c0;
          --line: #303b4d;
          --primary: #60a5fa;
          --primary-hover: #3b82f6;
          --primary-soft: #1f3656;
          --success: #69d391;
          --success-soft: #193a2b;
          --danger: #ff8a80;
          --danger-soft: #472825;
          --control: #222d3e;
          --shadow: 0 12px 30px rgba(0, 0, 0, .28);
        }
      }

      * { box-sizing: border-box; }
      body {
        width: 372px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      button, input, select { font: inherit; }

      .header {
        position: relative;
        padding: 18px 18px 16px;
        color: #fff;
        background: linear-gradient(135deg, #172b55 0%, #244ea4 58%, #3478e5 100%);
      }
      .brand { display: flex; align-items: center; gap: 11px; }
      .language-toggle {
        position: absolute;
        top: 13px;
        right: 14px;
        min-width: 40px;
        padding: 4px 9px;
        border: 1px solid rgba(255, 255, 255, .28);
        border-radius: 999px;
        color: #fff;
        background: rgba(255, 255, 255, .12);
        cursor: pointer;
        font-size: 10.5px;
        font-weight: 700;
      }
      .language-toggle:hover { background: rgba(255, 255, 255, .2); }
      .brand-icon {
        width: 38px;
        height: 38px;
        padding: 6px;
        border-radius: 11px;
        background: rgba(255, 255, 255, .14);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18);
      }
      h1 { margin: 0; font-size: 16px; line-height: 1.25; letter-spacing: .1px; }
      .subtitle { margin: 3px 0 0; color: rgba(255, 255, 255, .75); font-size: 11.5px; }
      .local-note {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        margin-top: 12px;
        padding: 4px 8px;
        border-radius: 999px;
        color: #dfffe9;
        background: rgba(20, 108, 62, .45);
        font-size: 10.5px;
        font-weight: 650;
      }
      .local-note::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #65e594; }

      main { display: grid; gap: 11px; padding: 12px; }
      .card {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .protection-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-color: color-mix(in srgb, var(--primary) 25%, var(--line));
        background: linear-gradient(135deg, var(--primary-soft), var(--card) 70%);
      }
      .protection-copy { min-width: 0; }
      .protection-title { margin: 0; font-size: 14px; font-weight: 720; }
      .protection-state { margin-top: 3px; color: var(--success); font-size: 11.5px; }
      .protection-card.is-off .protection-state { color: var(--danger); }

      .section-head { margin-bottom: 11px; }
      .section-title { margin: 0; font-size: 12px; font-weight: 750; letter-spacing: .2px; }
      .section-hint { margin: 2px 0 0; color: var(--muted); font-size: 10.5px; }
      .field + .field { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
      .field-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
      .field-label { font-weight: 620; }
      .field-note { margin: 3px 0 0; color: var(--muted); font-size: 10.5px; }
      select, input[type="text"] {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: var(--control);
        color: var(--text);
      }
      select { width: 152px; padding: 5px 28px 5px 9px; }
      input[type="text"] { width: 100%; margin-top: 8px; padding: 7px 10px; }
      select:focus, input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }

      #tf-switch { position: relative; flex: 0 0 auto; width: 44px; height: 24px; cursor: pointer; }
      #tf-switch input { position: absolute; opacity: 0; pointer-events: none; }
      .slider { position: absolute; inset: 0; border-radius: 999px; background: #aeb7c5; transition: .18s ease; }
      .slider::before {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        left: 2px;
        top: 2px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
        transition: .18s ease;
      }
      #tf-switch input:checked + .slider { background: var(--primary); }
      #tf-switch input:checked + .slider::before { transform: translateX(20px); }
      #tf-switch input:focus-visible + .slider { outline: 3px solid color-mix(in srgb, var(--primary) 30%, transparent); outline-offset: 2px; }

      #sites { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
      #sites .section-head { grid-column: 1 / -1; margin-bottom: 3px; }
      .site { display: flex; align-items: center; justify-content: space-between; gap: 5px; min-width: 0; min-height: 34px; padding: 0 7px; border: 1px solid var(--line); border-radius: 8px; background: var(--control); }
      .site-name { min-width: 0; overflow: hidden; color: var(--text); font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
      .pill {
        min-width: 44px;
        border: 1px solid color-mix(in srgb, var(--success) 24%, transparent);
        border-radius: 999px;
        padding: 3px 8px;
        color: var(--success);
        background: var(--success-soft);
        cursor: pointer;
        font-size: 10px;
        font-weight: 750;
        text-align: center;
      }
      .pill.warn { border-color: color-mix(in srgb, var(--danger) 24%, transparent); color: var(--danger); background: var(--danger-soft); }

      .save {
        width: 100%;
        min-height: 39px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: var(--primary);
        cursor: pointer;
        font-weight: 720;
        box-shadow: 0 5px 14px color-mix(in srgb, var(--primary) 25%, transparent);
      }
      .save:hover { background: var(--primary-hover); }
      .save:disabled { cursor: default; opacity: .7; }
      #status { min-height: 16px; margin-top: 7px; color: var(--success); font-size: 10.5px; text-align: center; }
    </style>
  </head>
  <body>
    <header class="header">
      <button class="language-toggle" id="languageToggle" type="button">EN</button>
      <div class="brand">
        <img class="brand-icon" src="../assets/icon48.png" alt="" />
        <div>
          <h1 data-i18n="title">隐私图片防护</h1>
          <p class="subtitle" data-i18n="subtitle">图片上传前，本地识别并遮挡敏感信息</p>
        </div>
      </div>
      <div class="local-note" data-i18n="localNote">仅在本机处理 · 支持离线使用</div>
    </header>

    <main>
      <section class="card protection-card" id="protectionCard">
        <div class="protection-copy">
          <p class="protection-title" data-i18n="protectionTitle">启用上传保护</p>
          <div class="protection-state" id="protectionState">保护已开启</div>
        </div>
        <label id="tf-switch" aria-label="启用上传保护">
          <input type="checkbox" id="enabled" />
          <span class="slider"></span>
        </label>
      </section>

      <section class="card">
        <div class="section-head">
          <h2 class="section-title" data-i18n="detectionTitle">检测设置</h2>
          <p class="section-hint" data-i18n="detectionHint">平衡识别范围、准确率与处理速度</p>
        </div>
        <div class="field">
          <div class="field-row">
            <div>
              <label class="field-label" for="strictness" data-i18n="strictnessLabel">检测强度</label>
              <p class="field-note" data-i18n="strictnessHint">建议使用“平衡”</p>
            </div>
            <select id="strictness">
              <option value="1" data-i18n="lenient">宽松</option>
              <option value="2" selected data-i18n="balanced">平衡（推荐）</option>
              <option value="3" data-i18n="strict">严格</option>
            </select>
          </div>
        </div>
        <div class="field">
          <div class="field-row">
            <div>
              <label class="field-label" for="ocrLang" data-i18n="ocrLabel">识别语言</label>
              <p class="field-note" data-i18n="ocrHint">仅加载所选语言模型</p>
            </div>
            <select id="ocrLang">
              <option value="eng" data-i18n="english">English</option>
              <option value="chi_sim" data-i18n="chinese">简体中文</option>
              <option value="eng+chi_sim" selected data-i18n="bilingual">中英双语（推荐）</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2 class="section-title"><label for="keywords" data-i18n="keywordsTitle">自定义敏感词</label></h2>
          <p class="section-hint" data-i18n="keywordsHint">公司名称、项目代号或内部文件标记</p>
        </div>
        <input type="text" id="keywords" placeholder="例如：Project-X, 董事会决议" data-i18n-placeholder="keywordsPlaceholder" />
        <p class="field-note" data-i18n="keywordsNote">多个词请使用逗号分隔，命中后将提示脱敏。</p>
      </section>

      <section class="card" id="sites"></section>

      <section>
        <button class="save" id="save" type="button" data-i18n="save">保存设置</button>
        <div id="status" role="status" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
